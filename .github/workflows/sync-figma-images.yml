name: Sync Finam images from Figma

on:
  workflow_dispatch:
  push:
    paths:
      - 'figma-assets.json'
      - 'scripts/sync-figma-images.mjs'
      - '.github/workflows/sync-figma-images.yml'

permissions:
  contents: write

concurrency:
  group: figma-asset-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check Figma access token
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "::error::Missing repository secret FIGMA_TOKEN. Configure a Figma personal access token with file read permission."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Sharp image optimizer
        run: npm install --no-save --no-package-lock --ignore-scripts=false sharp@0.34.4

      - name: Export only selected Figma image layers and optimize
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node scripts/sync-figma-images.mjs

      - name: Verify site references are present
        run: node scripts/verify-assets.mjs

      - name: Commit and push optimized outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets index.html styles.css ASSET-REPORT.md
          if git diff --cached --quiet; then
            echo 'No changes to publish'
          else
            git commit -m 'Re-export and optimize Finam image layers from Figma'
            git push origin HEAD:main
          fi
