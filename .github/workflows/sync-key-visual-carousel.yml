name: Sync Key Visual carousel from Figma

on:
  workflow_dispatch:
  push:
    paths:
      - 'key-visual-carousel.json'
      - 'scripts/sync-key-visual-carousel.mjs'
      - '.github/workflows/sync-key-visual-carousel.yml'

permissions:
  contents: write

concurrency:
  group: key-visual-carousel-figma-export
  cancel-in-progress: false

jobs:
  export-key-visual:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Figma API access
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "::error::Missing FIGMA_TOKEN repository secret"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Sharp for WebP optimization
        run: npm install --no-save --no-package-lock sharp@0.34.4

      - name: Validate JavaScript
        run: |
          node --check key-visual-carousel.js
          node --check scripts/sync-key-visual-carousel.mjs

      - name: Export six individual Figma frames at Retina resolution
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node scripts/sync-key-visual-carousel.mjs

      - name: Verify paths and diff
        run: |
          node scripts/verify-assets.mjs
          git diff --check
          git status --short

      - name: Commit optimized images and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets index.html KEY-VISUAL-EXPORT-REPORT.md
          if git diff --cached --quiet; then
            echo "Key Visual carousel already up to date"
          else
            git commit -m "Publish six optimized Figma Key Visual carousel slides"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
