name: Mobile visual comparison (375 / 390 / 430)

on:
  workflow_dispatch:
  push:
    paths:
      - 'styles.css'
      - '.github/workflows/mobile-visual-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify static build and carousel scripts
        run: |
          node scripts/verify-assets.mjs
          node --check modular-carousel.js
          node --check key-visual-carousel.js
          node --check components-carousel.js
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium for real mobile viewport screenshots
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Inspect reference scaling DOM and computed text metrics
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          script = """() => {
            const pick = el => {
              if (!el) return null;
              const r=el.getBoundingClientRect(),s=getComputedStyle(el), p=el.parentElement;
              return {tag:el.tagName,cls:(''+(el.className||'')).slice(0,90),id:el.id||'',txt:(el.innerText||'').trim().slice(0,66),
                font:s.fontFamily,size:s.fontSize,weight:s.fontWeight,lineHeight:s.lineHeight,
                letterSpacing:s.letterSpacing,color:s.color,zoom:s.zoom,
                rectW:r.width,rectH:r.height,cssW:el.offsetWidth,cssH:el.offsetHeight,
                rectOverCssH:el.offsetHeight?+(r.height/el.offsetHeight).toFixed(5):null,
                transform:s.transform,scale:s.scale,transformOrigin:s.transformOrigin,
                inlineStyle:(el.getAttribute('style')||'').slice(0,280),
                layout:s.position,display:s.display,whiteSpace:s.whiteSpace};
            };
            const texts=[...document.querySelectorAll('h1,h2,h3,h4,p,strong')].filter(e=>e.getBoundingClientRect().width>100 && (e.innerText||'').trim().length>3).slice(0,100);
            const target=texts.find(e=>(e.innerText||'').trim().startsWith('Service redesign')) || texts[0];
            let n=target,ancestors=[];
            for(let i=0;n&&i<20;i++,n=n.parentElement){const v=pick(n);if(v)ancestors.push(v);}
            const trans=[...document.querySelectorAll('*')].filter(e=>{const v=getComputedStyle(e);return v.transform!=='none'||v.zoom!=='1'||v.scale!=='none';}).slice(0,45).map(pick);
            return {url:location.href, width:innerWidth,devicePixelRatio,docWidth:document.documentElement.scrollWidth,
              meta:[...document.querySelectorAll('meta[name=viewport]')].map(e=>e.content),
              fonts:[...document.fonts].filter(f=>f.status==='loaded').map(f=>({family:f.family,weight:f.weight})),
              target:pick(target),ancestors,transformedElements:trans,texts:texts.map(pick),
              stylesheets:[...document.styleSheets].map(x=>x.href).filter(Boolean).slice(0,18)};
          }"""
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for width in (375,390,430):
                  ctx=browser.new_context(viewport={'width':width,'height':844},device_scale_factor=1,is_mobile=True,has_touch=True)
                  pg=ctx.new_page()
                  pg.goto('https://readymag.website/u875042579/5202538/',wait_until='domcontentloaded',timeout=65000)
                  pg.wait_for_timeout(1900)
                  pg.evaluate('() => document.fonts.ready')
                  result=pg.evaluate(script)
                  print('REF_SCALE_JSON_'+str(width)+' '+json.dumps(result,ensure_ascii=False))
                  ctx.close()
              browser.close()
          PY
      - name: Start local static site
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/finam-local-server.log 2>&1 &
          sleep 2
      - name: Compare individual glyph line boxes and widget padding
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          js="""(name) => {
            const targets = name==='reference'
              ? ['Service redesign that increased user growth by 135%','Beeline is one of','hypotheses','After the MVP launch','benefits notifications','Clear, visual notifications','results','2 months after','user growth rate']
              : ['finam','New visual language for Finam','Finam is one of','insights','Fragmented visual style','Inconsistent imagery','key visual','The central visual','results','Three months after','Page production time'];
            const elems=[...document.querySelectorAll('h1,h2,h3,h4,p,strong')];
            return targets.map(prefix=>{
              const el=elems.find(e=>(e.textContent||'').trim().toLowerCase().startsWith(prefix.toLowerCase()));
              if(!el)return {prefix,error:'not found'};
              const c=getComputedStyle(el),r=el.getBoundingClientRect(),tn=[...el.childNodes].find(n=>n.nodeType===3&&n.textContent.trim());
              let lineTops=[],firstLine='',lastLine='';
              if(tn){
                let groups={};
                const t=tn.textContent,range=document.createRange();
                for(let i=0;i<t.length;i++){
                  if(!t[i].trim())continue;
                  range.setStart(tn,i);range.setEnd(tn,i+1);
                  const rect=range.getBoundingClientRect();if(!rect.width||!rect.height)continue;
                  let key=Math.round(rect.y*2)/2;
                  (groups[key]??=[]).push(t[i]);
                }
                lineTops=Object.keys(groups).map(Number).sort((a,b)=>a-b);
                firstLine=(groups[lineTops[0]]||[]).join('');lastLine=(groups[lineTops.at(-1)]||[]).join('');
              }
              return {prefix,text:(el.innerText||'').slice(0,110),
                font:c.fontFamily,fontSize:c.fontSize,fontWeight:c.fontWeight,
                lineHeight:c.lineHeight,letterSpacing:c.letterSpacing,
                paddingTop:c.paddingTop,paddingBottom:c.paddingBottom,
                marginTop:c.marginTop,marginBottom:c.marginBottom,display:c.display,
                transform:c.transform,rectH:r.height,offsetH:el.offsetHeight,
                textContentRaw:(el.textContent||'').slice(-55),
                lineCount:lineTops.length,firstLine,lastLine,
                linePitch:lineTops.length>1?+(lineTops[1]-lineTops[0]).toFixed(3):null,
                top:r.top, x:r.x,width:r.width};
            });
          }"""
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox'])
            for width in (375,390,430):
              for name,url in [('reference','https://readymag.website/u875042579/5202538/'),('finam','http://127.0.0.1:4173/')]:
                c=b.new_context(viewport={'width':width,'height':844},is_mobile=True,has_touch=True)
                page=c.new_page()
                page.goto(url,wait_until='domcontentloaded',timeout=65000)
                page.wait_for_timeout(1100)
                page.evaluate('() => document.fonts.ready')
                result=page.evaluate(js,name)
                print('TEXT_LINE_METRICS_'+name+'_'+str(width)+' '+json.dumps(result,ensure_ascii=False))
                c.close()
            b.close()
          PY
      - name: Compare reference and local site at 3 mobile sizes
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          Path("mobile-visual-audit").mkdir(exist_ok=True)
          report = {}
          urls = {
              "reference": "https://readymag.website/u875042579/5202538/",
              "finam": "http://127.0.0.1:4173/"
          }
          def inspect(page):
              return page.evaluate("""() => {
                const fields = el => {
                  if (!el) return null;
                  const s = getComputedStyle(el), r = el.getBoundingClientRect();
                  return {tag:el.tagName, text:(el.innerText||'').trim().slice(0,90),
                    x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),
                    font:s.fontFamily,size:s.fontSize,weight:s.fontWeight,lineHeight:s.lineHeight,
                    letterSpacing:s.letterSpacing,color:s.color, marginLeft:s.marginLeft,
                    marginRight:s.marginRight,paddingLeft:s.paddingLeft,paddingRight:s.paddingRight};
                };
                const sel = ['main','.wrap','.intro','h1','.lead','.body-text','.section-title',
                  '.info-card','.info-card h3','.info-card p','.feature-copy',
                  '.hero-media','.hero-tile','.tile-one','.tile-two',
                  '#key-visual-media','#key-visual-carousel-viewport','.key-visual-slide img',
                  '#modular-media','#modular-carousel-viewport','.modular-slide img',
                  '#components-media','#components-carousel-viewport','.components-slide img',
                  '#examples-media','.examples-stack','.page-previews','.page-shot',
                  '.results','.results-grid','.stat-card','.stat-card strong','.stat-card p'];
                const visible = [...document.querySelectorAll('h1,h2,h3,h4,p,strong')]
                  .filter(e => {const r=e.getBoundingClientRect();return r.width>0&&r.height>0
                    &&getComputedStyle(e).visibility!=='hidden';}).slice(0,100).map(fields);
                return {viewport:innerWidth,docWidth:document.documentElement.scrollWidth,
                  docHeight:document.documentElement.scrollHeight,body:fields(document.body),
                  css: Object.fromEntries(sel.map(s=>[s,fields(document.querySelector(s))])),
                  visibleText:visible,
                  sections:[...document.querySelectorAll('main>section')].map(fields),
                  images:[...document.images].slice(0,120).map(el=>{const r=el.getBoundingClientRect();return {src:(el.currentSrc||el.src||'').slice(-130),x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),naturalW:el.naturalWidth,naturalH:el.naturalHeight};}),
                  fonts:[...document.fonts].map(f=>({family:f.family,weight:f.weight,status:f.status})).slice(0,20)};
              }""")
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True,args=["--no-sandbox"])
              for width in (375,390,430):
                  report[str(width)] = {}
                  for name,url in urls.items():
                      context=browser.new_context(viewport={"width":width,"height":844},
                          device_scale_factor=1,is_mobile=True,has_touch=True)
                      page=context.new_page()
                      error=None
                      try:
                          page.goto(url,wait_until="domcontentloaded",timeout=65000)
                          page.wait_for_timeout(2600)
                          page.evaluate("() => document.fonts.ready")
                          if name=="reference":
                              try: page.get_by_text("Reject all",exact=True).first.click(timeout=1500)
                              except Exception: pass
                      except Exception as exc:
                          error=str(exc)
                      try:
                          data=inspect(page)
                      except Exception as exc:
                          data={"error":str(exc)}
                      data["navigationError"]=error
                      report[str(width)][name]=data
                      height=data.get("docHeight",0)
                      try:
                          page.screenshot(path="mobile-visual-audit/"+name+"-"+str(width)+".png",
                            full_page=bool(height<20000),animations="disabled",timeout=25000)
                      except Exception as exc:
                          print("SCREENSHOT_FAILED",name,width,str(exc))
                      if name=="reference" and width==390:
                          for label in ("hypotheses","main screen","connected user widget","results"):
                              try:
                                  target=page.get_by_text(label,exact=True).first
                                  target.scroll_into_view_if_needed(timeout=5000)
                                  page.wait_for_timeout(350)
                                  page.screenshot(path="mobile-visual-audit/reference-390-"+label.replace(" ","-")+".png",full_page=False,animations="disabled",timeout=15000)
                              except Exception as exc:
                                  print("SECTION_SCREENSHOT_FAILED",label,str(exc))
                      if name=="finam":
                          if data.get("docWidth",0) > width+2:
                              print("WARNING_HORIZONTAL_OVERFLOW",width,data["docWidth"])
                          else:
                              print("NO_HORIZONTAL_OVERFLOW",width)
                      if name=="finam" and width==390:
                          for elem in ("one","two","three","four","five","six"):
                              sel="#example-image-"+elem
                              page.locator(sel).scroll_into_view_if_needed(timeout=12000)
                              page.wait_for_function("sel => {const im=document.querySelector(sel);return im && im.complete && im.naturalWidth>0}",arg=sel,timeout=16000)
                              sizes=page.locator(sel).evaluate("(im) => ({naturalW:im.naturalWidth,naturalH:im.naturalHeight,boxW:im.getBoundingClientRect().width,boxH:im.getBoundingClientRect().height,fit:getComputedStyle(im).objectFit})")
                              print("LOADED_EXAMPLE",sel,json.dumps(sizes))
                          for root,next_button,dot in (
                              ("#key-visual-carousel",".key-visual-next",".key-visual-dot"),
                              ("#modular-carousel",".modular-next",".modular-dot"),
                              ("#components-carousel",".components-next",".components-dot")):
                              page.locator(root).scroll_into_view_if_needed(timeout=12000)
                              page.locator(root+" "+next_button).click(timeout=12000)
                              dots=page.locator(root+" "+dot)
                              assert dots.nth(1).get_attribute("class") is not None and "is-current" in dots.nth(1).get_attribute("class"), root+" second slide did not activate"
                          print("PASSED_MOBILE_GALLERY_AND_CAROUSEL_INTERACTION_TESTS")
                      print("AUDIT",name,width,"body",data.get("body"),
                            "lead",data.get("css",{}).get(".lead"),
                            "section_title",data.get("css",{}).get(".section-title"),
                            "docWidth",data.get("docWidth"))
                      context.close()
              browser.close()
          Path("mobile-visual-audit/metrics.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding="utf8")
          print("AUDIT_METRICS_JSON_BEGIN")
          print(json.dumps(report,ensure_ascii=False))
          print("AUDIT_METRICS_JSON_END")
          PY
      - name: Upload mobile comparison screenshots and computed CSS metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finam-mobile-audit
          path: mobile-visual-audit/
          if-no-files-found: warn
